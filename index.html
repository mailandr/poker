<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Hosalotri</title>
    <link rel="stylesheet" href="assets/fonts/font.css">
    <link rel="stylesheet" href="style.css?v=20261101">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <meta name="Hosalotri Poker" content="Hosalotri Poker" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#35654D" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1f1a17" media="(prefers-color-scheme: dark)">
</head>

<body>
    <div class="main__canvas">
        <div class="u-generic-wrapper">
            <div class="u-generic-wrapper-margin">
                <!-- Header -->
                <div class="header">
                    <span class="header-img">
                        <img src="assets/img/poker.png" alt="poker cards" fetchpriority="low">
                    </span>
                    <div class="header-title">
                        <h1>Hosalotri Poker Runde</h1>
                    </div>
                </div>

                <!-- NOTE: NEWS BANNER -->
                <!-- <div class="news__container">
                    <div class="news__content">
                        +++ Nächste Poker Runde 31. Oktober 2025 +++
                    </div>
                </div> -->

                <!-- Turniere: werden aus tournaments.js gerendert -->
                <div id="tournaments"></div>

                <!-- Medaillenspiegel: wird automatisch aus tournaments.js berechnet -->
                <div class="tournament__stats-wrapper">
                    <h2 class="tournament__stats-label">
                        Medaillenspiegel
                    </h2>
                    <div class="tournament__stats">
                        <table>
                            <thead>
                                <tr>
                                    <th>Spieler</th>
                                    <th>&#129351;</th>
                                    <th>&#129352;</th>
                                    <th>&#129353;</th>
                                    <th class="tournament__stats--starts">Starts</th>
                                </tr>
                            </thead>
                            <tbody id="medal-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <span id="egg" class="easter-egg">Fold!!!</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="tournaments.js?v=20261101"></script>
    <script src="script.js?v=20261101"></script>
</body>

</html>
